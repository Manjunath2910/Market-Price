<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>How Much Does $1 Get You?</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div class="container">

    <!-- BACKGROUND -->
    <div class="bg-overlay"></div>

    <!-- TOP GLOW -->
    <div class="top-glow"></div>

    <!-- TITLE -->
    <div class="title">

    <h1>
        HOW MUCH DOES
        <br>
        <span>$1</span> GET YOU?
    </h1>

    <div class="title-line"></div>

</div>

    

    <!-- CHART -->
    <div class="chart-wrapper">
    
     <div class="chart-image-wrapper">

    <img
        src="./asset/pillars-chart.png"
        class="pillars-chart"
        alt="Comparison Chart"
    >

    <div class="price p1">₹94.88</div>
    <div class="price p2">₹94.20</div>
    <div class="price p3">₹93.75</div>
    <div class="price p4">₹93.40</div>
    <div class="price p5">₹93.15</div>
    <div class="price p6">₹93.00</div>


    <div class="pillar-chart">

    <img src="./asset/pillars/all-pillars.png" class="pillar-image">

    <!-- TOP LOGOS -->

    <img src="./assets/logos/pandamoney.png" class="top-logo top1">
    <img src="./assets/logos/wise.png" class="top-logo top2">
    <img src="./assets/logos/revolut.png" class="top-logo top3">
    <img src="./assets/logos/remitly.png" class="top-logo top4">
    <img src="./assets/logos/xoom.png" class="top-logo top5">
    <img src="./assets/logos/moneygram.png" class="top-logo top6">

</div>

</div>

    <div class="download-box">
        <button onclick="downloadAll()" class="download-btn">
            Download
        </button>
    </div>

</div>

    <!-- FLOOR -->
    <div class="floor-glow"></div>

    <!-- BRAND -->
    <div class="brand">

        <img
            src="./asset/pandamoney-footer.png"
            alt="Pandamoney"
            class="brand-footer"
        >

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
